name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # Must match the Python version in the Dockerfile base image.
      # The "Check Python version" step fails if they differ.
      PYTHON_VERSION: "3.15"

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Python version matches base image
        run: |
          BASE_IMAGE=$(sed -n 's/^FROM \([^ ]*synapsepythonclient:[^ ]*\).*/\1/p' Dockerfile | head -n1)
          IMAGE_PY=$(docker run --rm --entrypoint python "$BASE_IMAGE" \
            -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "Base image Python: $IMAGE_PY, CI Python: $PYTHON_VERSION"
          if [ "$IMAGE_PY" != "$PYTHON_VERSION" ]; then
            echo "::error::CI PYTHON_VERSION ($PYTHON_VERSION) does not" \
              "match the base image Python ($IMAGE_PY). Update" \
              "PYTHON_VERSION in ci.yml."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          # Use the synapseclient version from the Dockerfile base image tag
          # Read the full tag, so that suffixes such as -rc1 cause a failure
          SYN_VERSION=$(sed -n 's/^FROM .*synapsepythonclient:v\([^ @]*\).*/\1/p' Dockerfile | head -n1)
          if ! printf '%s' "$SYN_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not read a release synapseclient version" \
              "from Dockerfile (got '$SYN_VERSION'). Expected a line" \
              "like 'FROM ...synapsepythonclient:vX.Y.Z'"
            exit 1
          fi
          echo "synapseclient version: $SYN_VERSION"
          python -m pip install --upgrade pip
          pip install "synapseclient[pandas,curator]==${SYN_VERSION}"
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          python -m pytest test -v

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Build
        id: setup-build
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the Container
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: generate-jsonschema-action:test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test Local Action
        id: register
        uses: ./
        with:
          data-model-source: ./test/data_model.csv
          data-model-labels: "display_label"
          data-types: "Datatype1,Datatype2"
          output-directory: "test-schemas"
